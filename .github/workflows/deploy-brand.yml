name: Deploy brand (EC2)

on:
  push:
    branches: [main]
    paths:
      - "apps/brand/**"
      - "packages/**"
      - "tooling/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/deploy-brand.yml"

concurrency:
  group: deploy-brand
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Write the production env file
        run: |
          cat > apps/brand/.env.production << 'ENVEOF'
          ${{ secrets.ENV_PRODUCTION }}
          ENVEOF

      - name: Build
        run: pnpm --filter @wadzzo/brand... build

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key.pem
          chmod 600 ~/.ssh/deploy_key.pem
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Sync the monorepo (not env files, dependencies or git) to EC2
        run: |
          rsync -avz \
            --exclude='.env*' \
            --exclude='node_modules' --exclude='.git' \
            -e "ssh -i ~/.ssh/deploy_key.pem" \
            ./ \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:${{ secrets.EC2_APP_PATH }}/

      - name: Install dependencies and restart the app on EC2
        run: |
          ssh -i ~/.ssh/deploy_key.pem ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'REMOTE'
            cd ${{ secrets.EC2_APP_PATH }}
            pnpm install --frozen-lockfile
            pm2 restart brand-wadzzo || pm2 start "pnpm --filter @wadzzo/brand start" --name brand-wadzzo
            pm2 save
          REMOTE
