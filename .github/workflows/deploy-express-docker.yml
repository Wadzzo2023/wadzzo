name: Deploy task server (AWS EC2, Docker)

# The web apps deploy through Vercel. Only the worker (it takes the map agent, bulk pin creation and
# hotspot drops from the database's jobs table) runs on the server, as one Docker container.
# Off until cutover. Set the repository variable DEPLOY_EXPRESS_DOCKER=true and add the secrets
# EC2_SSH_KEY, EC2_HOST and EC2_USER.

on:
  push:
    branches: [main]
    paths:
      - "apps/express-wadzzo/**"
      - "packages/agent-contract/**"
      - "packages/errors/**"
      - "packages/geo/**"
      - "packages/jobs/**"
      - "packages/storage/**"
      - "packages/db/prisma/schema.prisma"
      - "packages/db/prisma/sql/2026-11-07-job-queue.sql"
      - "tooling/typescript/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "scripts/deploy-express.sh"
      - "scripts/apply-sql.sh"
      - ".github/workflows/deploy-express-docker.yml"
  workflow_dispatch:
    inputs:
      stage_only:
        description: "Build and load the image on the server but do not start it (before a cutover)"
        type: boolean
        default: false

# Two deploys at once would restart the one container twice and drop its job twice.
concurrency:
  group: deploy-express-docker
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.DEPLOY_EXPRESS_DOCKER == 'true'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    env:
      TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      # The image is large and Docker keeps a copy
      # of each layer, so the runner's default free space is not enough. Remove tools this job
      # never uses.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h / | tail -1

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Test the worker and what it uses
        run: pnpm --filter @wadzzo/express --filter @wadzzo/jobs --filter @wadzzo/geo test

      - uses: docker/setup-buildx-action@v3

      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/express-wadzzo/Dockerfile
          load: true
          tags: wadzzo-worker:${{ github.sha }}

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key.pem
          chmod 600 ~/.ssh/deploy_key.pem
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      # The image is built here, so the server never compiles anything: it only loads it.
      - name: Send the image to the server
        run: |
          docker save wadzzo-worker:${TAG} | gzip \
            | ssh -i ~/.ssh/deploy_key.pem ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} 'gunzip | docker load'

      # The jobs table (additive, safe to repeat): the brand apps and the worker both need it, so
      # it goes in before the new worker starts. It uses the server's own env file, so no database
      # password is stored in GitHub. (Best applied by hand before the push that switches the brand
      # app over; see docs/DEPLOYMENT.md.)
      - name: Create the jobs table if it is missing
        run: |
          scp -i ~/.ssh/deploy_key.pem packages/db/prisma/sql/2026-11-07-job-queue.sql scripts/apply-sql.sh \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:wadzzo/
          ssh -i ~/.ssh/deploy_key.pem ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
            'bash ~/wadzzo/apply-sql.sh ~/wadzzo/2026-11-07-job-queue.sql'

      - name: Swap the container, wait for /health, go back if it fails
        run: |
          ssh -i ~/.ssh/deploy_key.pem ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
            "NAME=wadzzo-worker IMAGE=wadzzo-worker HOST_PORT=4000 LOAD_ONLY=${{ inputs.stage_only && 1 || 0 }} bash -s -- ${TAG}" < scripts/deploy-express.sh

      # The scripts stay on the server too, so a cutover can start the staged image in seconds.
      - name: Keep the scripts current
        run: |
          scp -i ~/.ssh/deploy_key.pem scripts/express-watchdog.sh scripts/deploy-express.sh \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:wadzzo/
