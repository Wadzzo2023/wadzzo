# One lockfile, one set of versions. Every app and package asks for `catalog:`
# versions here, so upgrading a library is a one-line change.
packages:
  - apps/brand
  - apps/market
  - apps/ar
  - apps/express-wadzzo
  - packages/*
  - tooling/*
  # apps/mobile (Expo) is deliberately not a workspace member: React Native's
  # Metro bundler wants npm's flat node_modules. It installs with its own npm.

