# RETIRED (2026-11-06): the task server now runs in Docker behind Caddy at
# https://wadzzo.54-69-28-110.sslip.io (see docs/DEPLOYMENT.md, section 4). Kept for reference.
#
# nginx in front of the task server (apps/express-wadzzo).
#
# Install:  sudo cp nginx-wadzzo-api.conf /etc/nginx/sites-available/wadzzo-api
#           sudo ln -s /etc/nginx/sites-available/wadzzo-api /etc/nginx/sites-enabled/
#           sudo nginx -t && sudo systemctl reload nginx
#           sudo certbot --nginx -d portal.actn.xyz     # adds the 443 block + renewal
#
# The brand app calls https://portal.actn.xyz/wadzzo/api/ (the production default in
# packages/api/src/brand/lib/express/server-url.ts). The prefix is stripped here, so the
# task server itself serves /jobs, /hotspots and /health at its root.

server {
    listen 80;
    server_name portal.actn.xyz;

    # The brand portal sends JSON up to 50 MB (the task server's own limit).
    client_max_body_size 50m;

    location /wadzzo/api/ {
        proxy_pass http://127.0.0.1:4000/;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # /jobs/:id/stream is server-sent events: no buffering, long reads.
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Everything else on this host is not ours.
    location / {
        return 404;
    }
}
